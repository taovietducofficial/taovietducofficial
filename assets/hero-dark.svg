<style>
text{text-anchor:middle}
.nm{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:38px;font-weight:800}
.rl{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px}
.gh{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:13.5px;letter-spacing:1.3px;text-anchor:start}
.num{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:13.5px;letter-spacing:1.3px;text-anchor:end;font-variant-numeric:tabular-nums}
.fc{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:14px;letter-spacing:.3px}
.cp{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:12px;letter-spacing:1.5px}
.sg{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:1.2px}
.up{animation:up .6s cubic-bezier(.2,.7,.3,1) both}
.avatarIn{animation:avatarIn .7s cubic-bezier(.2,.7,.3,1) .12s both;transform-box:fill-box;transform-origin:center}
.orbit{animation:spin 26s linear infinite;transform-origin:450px 88px}
.rule{animation:grow .7s cubic-bezier(.2,.7,.3,1) .8s forwards;transform-box:fill-box;transform-origin:center}
.glow{animation:breathe 7s ease-in-out infinite}
.wire{fill:none;stroke-width:1.4;stroke-opacity:.4;stroke-dasharray:600;animation:draw 1.4s cubic-bezier(.2,.7,.3,1) .3s forwards}
.node{animation:blip 3.4s ease-in-out infinite}
.packet{animation:flow 3.4s linear .6s infinite}
.live{animation:live 2.2s ease-in-out infinite}
.hroll{animation:hroll 1.9s steps(14) .45s forwards}
@keyframes up{from{transform:translateY(9px)}to{transform:translateY(0)}}
@keyframes avatarIn{from{transform:scale(.88)}to{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes blip{0%,100%{opacity:.45}12%{opacity:1}}
@keyframes flow{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(600px);opacity:0}}
@keyframes live{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes hroll{from{transform:translateY(-308px)}to{transform:translateY(0)}}
</style>
