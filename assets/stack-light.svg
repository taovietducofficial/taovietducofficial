ext></g><g class="row" style="animation-delay:0.34s"><line x1="24" y1="226" x2="876" y2="226" stroke="#d1d9e0" stroke-opacity=".5"/><rect x="32" y="235.0" width="132" height="24" rx="12" fill="#8250df" fill-opacity=".14" stroke="#8250df" stroke-opacity=".5"/><text x="98.0" y="251.5" class="lb" fill="#8250df">Cloud</text><text x="184" y="251.5" class="it" fill="#1f2328">AWS · On-Premises</text></g><g class="row" style="animation-delay:0.40s"><line x1="24" y1="268" x2="876" y2="268" stroke="#d1d9e0" stroke-opacity=".5"/><rect x="32" y="277.0" width="132" height="24" rx="12" fill="#0969da" fill-opacity=".14" stroke="#0969da" stroke-opacity=".5"/><text x="98.0" y="293.5" class="lb" fill="#0969da">Engineering</text><text x="184" y="293.5" class="it" fill="#1f2328">REST API · Microservices · System Design · Testing · Observability</text></g>
