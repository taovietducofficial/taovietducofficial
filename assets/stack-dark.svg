ext></g><g class="row" style="animation-delay:0.34s"><line x1="24" y1="226" x2="876" y2="226" stroke="#30363d" stroke-opacity=".5"/><rect x="32" y="235.0" width="132" height="24" rx="12" fill="#a371f7" fill-opacity=".14" stroke="#a371f7" stroke-opacity=".5"/><text x="98.0" y="251.5" class="lb" fill="#a371f7">Cloud</text><text x="184" y="251.5" class="it" fill="#e6edf3">AWS · On-Premises</text></g><g class="row" style="animation-delay:0.40s"><line x1="24" y1="268" x2="876" y2="268" stroke="#30363d" stroke-opacity=".5"/><rect x="32" y="277.0" width="132" height="24" rx="12" fill="#39c5cf" fill-opacity=".14" stroke="#39c5cf" stroke-opacity=".5"/><text x="98.0" y="293.5" class="lb" fill="#39c5cf">Engineering</text><text x="184" y="293.5" class="it" fill="#e6edf3">REST API · Microservices · System Design · Testing · Observability</text></g>
